<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار المستقبل | فريق SUPER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--mut:#8aa3c2;--ln:#1c3350;--pn:#08182b;--ac:#4a9bff;--ok:#3ddc97;--no:#ff5a78;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:#eaf2ff;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-weight:400;line-height:1.7;background:#030b16 radial-gradient(ellipse 80% 40% at 50% 0%,#12417a 0%,transparent 70%) no-repeat}
.wrap{max-width:560px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
.hero{text-align:center;margin-bottom:26px}
h1{font-size:clamp(32px,8vw,46px);font-weight:300;line-height:1.3}
h1 b{font-weight:700;color:var(--ac)}
.lead{color:var(--mut);font-size:15px;margin-top:8px}
.glass,.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:14px}
input{width:100%;padding:13px 16px;border-radius:10px;border:1px solid #2a4568;background:#030b16;color:#fff;font:400 17px 'Cairo',sans-serif;text-align:center;outline:none}
input::placeholder{color:#5f7a9c}
input:focus{border-color:var(--ac)}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:10px;border:0;background:#fff;color:#031226;font:600 16px 'Cairo',sans-serif;cursor:pointer}
.btn:hover{background:#dbe9ff}
.err{color:#ff8da1;min-height:22px;margin-top:8px;font-size:14px;text-align:center}
h2{font-size:15px;font-weight:600;color:var(--mut);margin-bottom:8px}
.hud{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:10px}
.hud small{display:inline}.hud b{font-weight:600;color:#fff;margin-inline-start:4px}
.hud div{display:block}
.bar{height:3px;background:var(--ln);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.q{font-size:clamp(20px,5vw,26px);font-weight:600;line-height:1.7;margin:22px 0 18px}
.opts{display:grid;gap:8px}
.opt{display:block;text-align:right;padding:12px 16px;border-radius:10px;border:1px solid #2a4568;background:transparent;color:#fff;font:400 16px 'Cairo',sans-serif;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac);background:#0c2038}
.opt s{display:none}
.opt.ok{border-color:var(--ok);background:#3ddc9718}
.opt.no{border-color:var(--no);background:#ff5a7818}
.pop{min-height:26px;margin-top:12px;text-align:center;font-weight:600}
.score{text-align:center}
.score .sub{color:var(--mut);font-size:15px}
.score .n{font-size:68px;font-weight:300;line-height:1.1}
.rank{margin:6px 0 2px;color:var(--ac);font-weight:600}
.lb{list-style:none;padding:0}
.lb li{display:grid;grid-template-columns:34px 1fr 54px 70px;gap:6px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--ln);font-size:15px}
.lb li:last-child{border-bottom:0}
.lb li.th{font-size:12px;color:var(--mut);padding-block:0 6px}
.lb li.me{background:#4a9bff22;border-radius:8px}
.lb .p{text-align:center;color:var(--mut)}
.lb li.t1 .p,.lb li.t2 .p,.lb li.t3 .p{color:#fff;font-weight:700}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .tm,.lb li.th span:nth-child(3){color:var(--mut);text-align:center}
.lb .pt{text-align:left;font-weight:600}
.note{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.ex{color:var(--mut);font-size:15px;font-weight:400;text-align:right;border-top:1px solid var(--ln);margin-top:10px;padding-top:10px}
.ar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);font-size:15px}
.ab{display:flex;gap:6px}
.ab button{background:transparent;border:1px solid #2a4568;color:#fff;border-radius:8px;padding:3px 12px;font:400 13px 'Cairo',sans-serif;cursor:pointer}
.ab .dl{border-color:var(--no);color:#ff8da1}
.ar input{padding:6px 10px;font-size:15px;text-align:right}
.hide{display:none}
.ar.flag{background:#ff5a7814;border-radius:8px;padding-inline:8px}
.ar .tag{color:#ff8da1;font-size:12px;margin-inline-start:6px}
footer{text-align:center;color:#5f7a9c;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <div class="hero">
      <h1>نحن فريق <b>SUPER</b></h1>
      <p class="lead">اختبر معلوماتك في المستقبل والتكنولوجيا، وتنافس على لوحة الصدارة.</p>
    </div>
    <div class="glass">
      <input id="name" maxlength="20" placeholder="اكتب اسمك" autocomplete="off">
      <div class="err" id="err"></div>
      <button class="btn" id="go">ابدأ الاختبار</button>
    </div>
    <div class="glass"><h2>أفضل النتائج</h2><ol class="lb" id="lbHome"></ol></div>
  </section>

  <section id="game" class="card hide">
    <div class="hud"><div><small>السؤال</small><b><span id="qn">1</span>/10</b></div><div><small>التتابع</small><b id="st">0</b></div><div><small>النقاط</small><b id="sc">0</b></div></div>
    <div class="bar"><i id="tm"></i></div>
    <div class="q" id="qt"></div>
    <div class="opts" id="op"></div>
    <div class="pop" id="pop"></div>
  </section>

  <section id="end" class="hide">
    <div class="glass score">
      <div class="sub" id="who"></div>
      <div class="n" id="fin">0</div>
      <div class="sub">نقطة</div>
      <div class="rank" id="rk"></div>
      <p class="sub" id="ttl"></p>
    </div>
    <div class="glass"><h2>لوحة الصدارة</h2><ol class="lb" id="lbEnd"></ol></div>
    <button class="btn" id="again">العب مرة أخرى</button>
    <div class="note" id="mode"></div>
  </section>
  <section id="admin" class="hide">
    <div class="glass" id="alog"><h2>دخول المشرف</h2><input id="apw" type="password" placeholder="كلمة السر" autocomplete="off"><div class="err" id="aerr"></div><button class="btn" id="alogin">دخول</button></div>
    <div class="glass hide" id="apanel"><h2>إدارة المشتركين <span id="acount"></span></h2><div class="err" id="amsg"></div><div id="alist"></div><button class="btn" id="apurge">حذف الأسماء غير اللائقة</button><button class="btn" id="areset">تصفير اللوحة</button><button class="btn" id="apwbtn">تغيير كلمة السر</button><div class="hide" id="apwbox"><input id="apw2" type="password" placeholder="كلمة السر الجديدة (6 أحرف على الأقل)" autocomplete="off"><button class="btn" id="apwsave">حفظ كلمة السر الجديدة</button></div><button class="btn" id="aexit">خروج</button></div>
  </section>
  <footer>فريق SUPER للروبوتات</footer>
</div>

<script src="filter.js"></script>
<script>
const {isBad,nameError,norm,hid}=SuperFilter;

/* [سؤال, [الخيارات], رقم الإجابة الصحيحة] */
const BANK=[["ماذا يعني الاختصار AI؟",["الذكاء الاصطناعي","الواقع الافتراضي","إنترنت الأشياء","الحوسبة السحابية"],0,"AI اختصار Artificial Intelligence، أي الذكاء الاصطناعي: قدرة الآلات على تنفيذ مهام تتطلب ذكاءً بشرياً."],["أي لغة برمجة تُستخدم بكثرة في الذكاء الاصطناعي؟",["Python","Ruby","Swift","Pascal"],0,"بايثون هي الأكثر استخداماً في الذكاء الاصطناعي لسهولتها وتوفر مكتبات قوية مثل TensorFlow وPyTorch."],["ما اسم المركبة الجوالة التي هبطت على المريخ عام 2021؟",["Perseverance","Curiosity","Opportunity","Spirit"],0,"هبطت المركبة Perseverance على المريخ في فبراير 2021 للبحث عن علامات حياة قديمة، أما Curiosity فهبطت عام 2012."],["ماذا تعني IoT؟",["إنترنت الأشياء","نظام التشغيل","لغة البرمجة","شبكة الأقمار"],0,"IoT اختصار Internet of Things، أي ربط الأجهزة اليومية بالإنترنت لتتبادل البيانات."],["ما الجيل الذي يلي شبكات الجوال 4G؟",["5G","3G","2G","1G"],0,"5G هو الجيل الذي جاء بعد 4G، بسرعات أعلى وزمن استجابة أقل."],["الروبوت الذي يشبه جسم الإنسان يسمى؟",["روبوت بشري","روبوت صناعي","روبوت زاحف","روبوت طائر"],0,"الروبوت البشري (Humanoid) صُمّم ليشبه جسم الإنسان برأس وذراعين وساقين."],["أي مكوّن يحرّك مفاصل الروبوت؟",["المحركات","الحساسات","الكاميرات","البطاريات"],0,"المحركات (Actuators) تحوّل الطاقة إلى حركة، فتحرّك مفاصل الروبوت وأجزاءه."],["ما وظيفة الحساسات في الروبوت؟",["استشعار البيئة","تخزين الملفات","تبريد المعالج","تشغيل الشاشة"],0,"تجمع الحساسات معلومات عن البيئة كالمسافة والضوء والحرارة ليتصرف الروبوت بناءً عليها."],["أي من التالي لوحة تحكم إلكترونية شائعة في الروبوتات؟",["Arduino","Linux","Android","Windows"],0,"Arduino لوحة تحكم إلكترونية مفتوحة المصدر تُستخدم كثيراً في الروبوتات والمشاريع التعليمية، أما الباقي فأنظمة تشغيل."],["كيف تصنع الطابعة ثلاثية الأبعاد الأجسام؟",["إضافة طبقات","قص الألواح","نحت الخشب","حفر الصخور"],0,"تبني الطابعة ثلاثية الأبعاد الجسم بإضافة طبقات رقيقة فوق بعضها حتى يكتمل الشكل."],["أي مصدر من التالي يُعدّ طاقة متجددة؟",["طاقة الرياح","طاقة الفحم","طاقة النفط","طاقة الغاز"],0,"طاقة الرياح متجددة لأن الرياح لا تنفد، أما الفحم والنفط والغاز فوقود أحفوري ينفد مع الزمن."],["ماذا تعني VR؟",["الواقع الافتراضي","الواقع المعزز","الفيديو المباشر","الراديو المرئي"],0,"VR اختصار Virtual Reality، بيئة رقمية كاملة يدخلها المستخدم بنظارة، أما الواقع المعزز (AR) فيضيف عناصر رقمية إلى العالم الحقيقي."],["الطائرة الصغيرة التي تُقاد عن بُعد بدون طيار تسمى؟",["Drone","Router","Server","Cable"],0,"الدرون (Drone) طائرة بدون طيار تُقاد عن بُعد أو تطير بشكل آلي."],["ما الأرقام التي يعتمد عليها النظام الثنائي في الحاسوب؟",["0 و 1","1 و 2","0 و 9","1 و 10"],0,"يستخدم النظام الثنائي الرقمين 0 و1 فقط، وبهما يخزّن الحاسوب كل البيانات."],["ما أصغر وحدة لقياس المعلومات في الحاسوب؟",["البت","البايت","الكيلوبايت","الميغابايت"],0,"البت (Bit) أصغر وحدة معلومات في الحاسوب، وكل 8 بتات تساوي بايتاً واحداً."],["أي وحدة من التالي هي الأكبر في سعة التخزين؟",["تيرابايت","غيغابايت","ميغابايت","كيلوبايت"],0,"الترتيب من الأصغر إلى الأكبر: كيلوبايت، ثم ميغابايت، ثم غيغابايت، ثم تيرابايت."],["ما هدف الأمن السيبراني؟",["حماية البيانات","تسريع الإنترنت","صناعة الألعاب","تصميم الشعارات"],0,"يحمي الأمن السيبراني البيانات والأنظمة من الاختراق والتخريب والسرقة."],["ما الذي يساعد السيارة ذاتية القيادة على رؤية الطريق؟",["الكاميرات والرادار","المذياع والهوائي","البوصلة والخريطة","الطابعة والشاشة"],0,"ترى السيارة ذاتية القيادة الطريق عبر الكاميرات والرادار، ويحلل الذكاء الاصطناعي ما تلتقطه."],["من الكاتب الذي ظهرت في مسرحيته كلمة «روبوت» لأول مرة عام 1920؟",["كاريل تشابيك","إسحاق أسيموف","جول فيرن","أرثر كلارك"],0,"ظهرت كلمة «روبوت» أول مرة في مسرحية R.U.R. للكاتب التشيكي كاريل تشابيك عام 1920."],["أين تُخزَّن البيانات في الحوسبة السحابية؟",["خوادم بعيدة","ذاكرة الهاتف","قرص صلب","بطاقة ذاكرة"],0,"في الحوسبة السحابية تُخزَّن البيانات وتُعالَج على خوادم بعيدة نصل إليها عبر الإنترنت."],["ماذا نسمّي تعلّم الآلة من البيانات دون برمجة كل خطوة؟",["التعلّم الآلي","التشفير الآلي","التصنيع الآلي","التصحيح الآلي"],0,"التعلّم الآلي (Machine Learning) يجعل الآلة تتعلم الأنماط من البيانات بدل أن نبرمج كل خطوة."],["ما لغة المتصفح الأساسية لجعل صفحات الويب تفاعلية؟",["JavaScript","Python","Pascal","Fortran"],0,"جافاسكربت (JavaScript) هي لغة المتصفح الأساسية التي تجعل صفحات الويب تفاعلية."],["ما استخدام نظام GPS؟",["تحديد الموقع","تحديد الوزن","تحديد الصوت","تحديد الحرارة"],0,"GPS نظام ملاحة عبر الأقمار الصناعية يحدد الموقع الجغرافي بدقة."],["أي كوكب يتصدّر خطط الاستيطان المستقبلية؟",["المريخ","عطارد","نبتون","زحل"],0,"المريخ من أبرز أهداف خطط الاستكشاف والاستيطان المستقبلية لقربه النسبي من الأرض."]];
const TEAM=[["في أي سنة تأسس فريق SUPER؟",["2020","2018","2019","2021"],0,"تأسس فريق SUPER عام 2020."],["ما فئة فريق SUPER في المسابقات؟",["FTC","FLL","FRC","WRO"],0,"يشارك فريق SUPER في فئة FIRST Tech Challenge المعروفة اختصاراً بـ FTC."],["ما اسم مسابقة الروبوتات التي قاد فريق SUPER جلبها إلى ليبيا للمرة الأولى؟",["FIRST LEGO League (FLL)","FIRST Tech Challenge (FTC)","FIRST Robotics Competition (FRC)","World Robot Olympiad (WRO)"],0,"قاد فريق SUPER جلب مسابقة FIRST LEGO League (FLL) إلى ليبيا للمرة الأولى."]];
const $=id=>document.getElementById(id);
const show=id=>["home","game","end","admin"].forEach(s=>$(s).classList.toggle("hide",s!==id));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TOTAL=10,SEC=20,LET=["أ","ب","ج","د"];

/* ===== التخزين: مباشر عبر db إن توفّر، وإلا على هذا الجهاز ===== */
let live=false,mem=[],APH="";
async function api(method,body,admin){
  const r=await fetch("/api/lb"+(method==="GET"?"?t="+Date.now():""),{method,cache:"no-store",headers:{"content-type":"application/json",...(admin?{"x-admin":APH}:{})},body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok||d===null){const e=new Error((d&&d.error)||r.status);e.status=r.status;e.code=d&&d.error;throw e}
  return d;
}
setTimeout(()=>{loadBoard();setInterval(()=>{if(!$("home").classList.contains("hide"))loadBoard()},15000)},0);
function localGet(){try{return JSON.parse(localStorage.getItem("youth_lb")||"[]")}catch(e){return mem}}
function localSet(a){mem=a;try{localStorage.setItem("youth_lb",JSON.stringify(a))}catch(e){}}
const rows=a=>a.sort((x,y)=>y.score-x.score||x.time-y.time);
async function getBoard(){
  try{const d=await api("GET");live=true;return rows(d)}catch(e){live=false}
  return rows(localGet());
}
async function saveScore(r){
  const id=hid(norm(r.name)); let saved=false;
  try{await api("POST",{action:"score",name:r.name,score:r.score,time:r.time,ok:r.ok});saved=true;live=true}catch(e){if(e.status===422)return false;live=false}
  if(!saved){const a=localGet(),i=a.findIndex(x=>x.id===id);r.id=id;
    if(i<0)a.push(r);else if(a[i].score<r.score||(a[i].score===r.score&&a[i].time>r.time))a[i]=r;localSet(a)}
  return true;
}
function drawBoard(el,list,me,n){
  el.innerHTML="";
  const mk=(c,t,cls)=>{const s=document.createElement("span");if(cls)s.className=cls;s.textContent=t;return s};
  if(!list.length){const li=document.createElement("li");li.style.gridTemplateColumns="1fr";li.textContent="لا توجد نتائج بعد، كن أول المتصدرين";el.append(li);return}
  const th=document.createElement("li");th.className="th";th.append(mk(0,"#"),mk(0,"الاسم"),mk(0,"الزمن"),mk(0,"النقاط"));el.append(th);
  list.slice(0,n).forEach((r,i)=>{
    const li=document.createElement("li");
    li.className=(i<3?"t"+(i+1)+" ":"")+(me&&norm(r.name)===norm(me)?"me":"");
    li.append(mk(0,i+1,"p"),mk(0,r.name,"nm"),mk(0,Math.round(r.time||0)+" ث","tm"),mk(0,r.score,"pt"));el.append(li)});
}
async function loadBoard(){drawBoard($("lbHome"),await getBoard(),null,5)}

/* ===== اللعبة ===== */
let G;
function cleanName(v){return v.replace(/\s+/g," ").trim()}
const NAME_MSG={bad_length:"الرجاء كتابة اسمك (حرفان على الأقل).",bad_chars:"يُسمح بالحروف والأرقام والمسافات فقط.",bad_contact:"لا يُسمح بكتابة أرقام هاتف أو روابط في الاسم.",bad_name:"هذا الاسم غير لائق، الرجاء اختيار اسم آخر."};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("go").onclick=()=>{
  const name=cleanName($("name").value),bad=nameError(name);
  if(bad)return $("err").textContent=NAME_MSG[bad];
  $("err").textContent="";
  G={name,i:0,score:0,ok:0,streak:0,time:0,qs:shuffle(shuffle(TEAM).slice(0,2).concat(shuffle(BANK).slice(0,TOTAL-2))).map(q=>{const o=shuffle(q[1].map((t,k)=>[t,k===q[2]]));return{t:q[0],o,e:q[3]}})};
  show("game");ask();
};
function ask(){
  const q=G.qs[G.i];$("qn").textContent=G.i+1;$("sc").textContent=G.score;$("st").textContent=G.streak;
  $("qt").textContent=q.t;$("pop").textContent="";$("op").innerHTML="";
  q.o.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";
    const l=document.createElement("s");l.textContent=LET[k];const t=document.createElement("span");t.textContent=o[0];
    b.append(l,t);b.onclick=()=>answer(k);$("op").append(b)});
  G.t0=performance.now();G.left=SEC;G.done=false;tick();
  clearInterval(G.iv);G.iv=setInterval(tick,100);
}
function tick(){
  const el=(performance.now()-G.t0)/1000;G.left=Math.max(0,SEC-el);
  $("tm").style.width=(G.left/SEC*100)+"%";
  if(G.left<=0&&!G.done)answer(-1);
}
function answer(k){
  if(G.done)return;G.done=true;clearInterval(G.iv);
  const q=G.qs[G.i],used=Math.min(SEC,(performance.now()-G.t0)/1000);G.time+=used;
  const right=k>=0&&q.o[k][1];let msg;
  if(right){G.ok++;G.streak++;const sp=Math.round(G.left/SEC*50),sk=Math.min(50,(G.streak-1)*10),pts=100+sp+sk;G.score+=pts;
    msg=" صحيح! +"+pts+(sk?" ":"")}
  else{G.streak=0;msg=k<0?" انتهى الوقت!":" إجابة خاطئة"}
  [...$("op").children].forEach((b,j)=>{b.disabled=true;if(q.o[j][1])b.classList.add("ok");else if(j===k)b.classList.add("no")});
  const pm=document.createElement("div");pm.textContent=msg;pm.style.color=right?"var(--ok)":"var(--no)";
  const ex=document.createElement("div");ex.className="ex";ex.textContent=q.e||"";
  const nx=document.createElement("button");nx.className="btn";nx.textContent=G.i+1<TOTAL?"السؤال التالي":"عرض النتيجة";nx.onclick=()=>{G.i++;G.i<TOTAL?ask():finish()};
  $("pop").replaceChildren(pm,ex,nx);
  $("sc").textContent=G.score;$("st").textContent=G.streak;
}
const TITLES=[[1300,"أسطورة المستقبل  أنت من طراز SUPER!"],[1000,"مبتكر متميّز  معرفتك تقنية رائعة!"],[650,"مستكشف واعد  استمر وستصل للقمة!"],[0,"بداية جيدة  حاول مجدداً لتتصدّر!"]];
async function finish(){
  show("end");$("who").textContent=G.name;$("fin").textContent=G.score;
  $("ttl").textContent=(TITLES.find(t=>G.score>=t[0])||TITLES[3])[1]+" — "+G.ok+" من "+TOTAL+" إجابات صحيحة";
  $("rk").textContent="جارٍ حساب ترتيبك…";
  const saved=await saveScore({name:G.name,score:G.score,time:Math.round(G.time*10)/10,ok:G.ok,at:Date.now()});
  if(!saved){$("rk").textContent="تعذّر حفظ نتيجتك: الاسم غير مقبول.";drawBoard($("lbEnd"),await getBoard(),null,10);return}
  const b=await getBoard(),pos=b.findIndex(r=>norm(r.name)===norm(G.name))+1;
  $("rk").textContent=pos?"ترتيبك: "+pos+" من "+b.length:"";
  drawBoard($("lbEnd"),b,G.name,10);
  $("mode").textContent=live?" لوحة الصدارة مباشرة لجميع الزوار":"لوحة الصدارة محفوظة على هذا الجهاز فقط";
}
$("again").onclick=()=>{$("name").value="";show("home");loadBoard()};

/* ===== لوحة المشرف (الرابط + #admin) ===== */
// بصمة SHA-256 لكلمة السر (تُستخدم فقط عند عدم توفر الخادم). الخادم هو المرجع عند توفره.
const AH="9a0ee89e00a006877eca0c28eebeb38aa301469b9cce8012b6ee04b13079a7e8";
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
function adminErr(e){
  if(e&&e.status===401)return "كلمة السر غير مقبولة من الخادم. سجّل الخروج ثم ادخل من جديد.";
  if(e&&e.status===404)return "هذا المشترك لم يعد موجوداً.";
  if(e&&NAME_MSG[e.code])return NAME_MSG[e.code];
  return "تعذّرت العملية، تأكد من الاتصال ثم حاول مرة أخرى.";
}
async function delEntry(r){
  if(live){await api("POST",{action:"delete",id:r.id},true);return}
  localSet(localGet().filter(x=>x.id!==r.id));
}
async function renameEntry(r,name){
  const bad=nameError(name);if(bad){const e=new Error(bad);e.code=bad;throw e}
  if(live){await api("POST",{action:"rename",id:r.id,name},true);return}
  const a=localGet(),nid=hid(norm(name)),cur=a.find(x=>x.id===r.id)||r,other=a.find(x=>x.id===nid&&x.id!==r.id);
  let d={...cur,name,id:nid};
  if(other&&(other.score>d.score||(other.score===d.score&&other.time<=d.time)))d={...other,name};
  localSet(a.filter(x=>x.id!==r.id&&x.id!==nid).concat([d]));
}
async function renderAdmin(){
  const el=$("alist"),b=await getBoard();el.innerHTML="";
  $("acount").textContent="("+b.length+") "+(live?"مباشر":"محفوظ على هذا الجهاز");
  if(!b.length){el.textContent="لا يوجد مشتركون.";return}
  const run=async f=>{try{await f();$("amsg").textContent="";await renderAdmin()}catch(e){$("amsg").textContent=adminErr(e)}};
  b.forEach(r=>{
    const row=document.createElement("div");row.className="ar"+(isBad(r.name)?" flag":"");
    const nm=document.createElement("span");nm.textContent=r.name+" — "+r.score;
    if(isBad(r.name)){const t=document.createElement("span");t.className="tag";t.textContent="غير لائق";nm.append(t)}
    const mk=(t,c,f)=>{const x=document.createElement("button");x.textContent=t;if(c)x.className=c;x.onclick=f;return x};
    const box=(...k)=>{const a=document.createElement("div");a.className="ab";a.append(...k);return a};
    const normal=()=>row.replaceChildren(nm,box(mk("تعديل","",edit),mk("حذف","dl",del)));
    const edit=()=>{const i=document.createElement("input");i.value=r.name;i.maxLength=20;
      const save=()=>run(()=>renameEntry(r,cleanName(i.value)));
      i.addEventListener("keydown",e=>{if(e.key==="Enter")save()});
      row.replaceChildren(i,box(mk("حفظ","",save),mk("إلغاء","",()=>{$("amsg").textContent="";normal()})));i.focus()};
    const del=()=>{const t=document.createElement("span");t.textContent="حذف "+r.name+"؟";
      row.replaceChildren(t,box(mk("تأكيد","dl",()=>run(()=>delEntry(r))),mk("إلغاء","",normal)))};
    normal();el.append(row);
  });
}
function route(){if(location.hash==="#admin"){show("admin");$("alog").classList.remove("hide");$("apanel").classList.add("hide");$("apw").value="";$("aerr").textContent="";$("amsg").textContent="";APH=""}}
addEventListener("hashchange",route);route();
$("alogin").onclick=async()=>{
  const btn=$("alogin");if(btn.disabled)return;btn.disabled=true;$("aerr").textContent="";
  try{
    const h=await sha($("apw").value);APH=h;let ok=false;
    try{await api("POST",{action:"auth"},true);ok=true;live=true}
    catch(e){if(e.status===401)ok=false;else ok=(h===AH)}   // الخادم غير متاح: نعتمد البصمة المحلية
    if(!ok){APH="";return $("aerr").textContent="كلمة السر غير صحيحة."}
    $("apw").value="";$("alog").classList.add("hide");$("apanel").classList.remove("hide");await renderAdmin();
  }catch(e){$("aerr").textContent="تعذّر التحقق من كلمة السر."}
  finally{btn.disabled=false}
};
$("apw").addEventListener("keydown",e=>{if(e.key==="Enter")$("alogin").click()});
$("aexit").onclick=()=>{APH="";try{location.hash=""}catch(e){}show("home");loadBoard()};

// حذف كل الأسماء غير اللائقة دفعة واحدة (ضغطتان للتأكيد)
let pg=0;$("apurge").onclick=async()=>{
  if(!pg){pg=1;$("apurge").textContent="اضغط مرة ثانية لحذف غير اللائق";setTimeout(()=>{pg=0;$("apurge").textContent="حذف الأسماء غير اللائقة"},4000);return}
  pg=0;$("apurge").textContent="حذف الأسماء غير اللائقة";
  try{
    if(live)await api("POST",{action:"purge"},true);
    else localSet(localGet().filter(x=>!isBad(x.name)));
    $("amsg").textContent="";await renderAdmin();
  }catch(e){$("amsg").textContent=adminErr(e)}
};

// تصفير اللوحة (ضغطتان للتأكيد) — عملية واحدة على الخادم
let rs=0;$("areset").onclick=async()=>{
  if(!rs){rs=1;$("areset").textContent="اضغط مرة ثانية لحذف الجميع";setTimeout(()=>{rs=0;$("areset").textContent="تصفير اللوحة"},4000);return}
  rs=0;$("areset").textContent="تصفير اللوحة";
  try{
    if(live)await api("POST",{action:"reset"},true);else localSet([]);
    $("amsg").textContent="";await renderAdmin();
  }catch(e){$("amsg").textContent=adminErr(e)}
};

// تغيير كلمة السر (يُحفظ على الخادم كبصمة فقط)
$("apwbtn").onclick=()=>{$("apwbox").classList.toggle("hide");$("apw2").value=""};
$("apwsave").onclick=async()=>{
  const v=$("apw2").value;
  if(v.length<6)return $("amsg").textContent="كلمة السر الجديدة قصيرة (6 أحرف على الأقل).";
  if(!live)return $("amsg").textContent="تغيير كلمة السر متاح فقط عند الاتصال بالخادم.";
  try{
    const h=await sha(v);await api("POST",{action:"setpw",hash:h},true);APH=h;
    $("apwbox").classList.add("hide");$("apw2").value="";$("amsg").textContent="تم تغيير كلمة السر بنجاح.";
  }catch(e){$("amsg").textContent=adminErr(e)}
};
</script>
